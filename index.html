<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Employer Hub | Work Ready Oklahoma</title>
<style>
:root{
  --horizon:#6fc2d7;--flame:#fb9a2d;--steel:#5a5c61;--reef:#4e8897;--abyss:#2c4e56;--ember:#c97b24;--terra:#975c1b;
  --laguna:#4681c2;--seaglass:#4fc1b2;--coral:#eb5a57;--pebble:#333333;
  --bg:#f4f8f9;--surface:#fff;--ink:#333333;--muted:#5a5c61;--line:#d6e2e6;--brand:#2c4e56;--brand-ink:#fff;--accent:#fb9a2d;
  --t1:#1e5f57;--t1bg:#d6f2ee;--t2:#274f82;--t2bg:#dce8f7;--t3:#4a4c51;--t3bg:#e9eaec;
  --warn:#a8302d;--warnbg:#fde4e3;--radius:12px;--shadow:0 1px 2px rgba(44,78,86,.08),0 3px 10px rgba(44,78,86,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 Arial,"Helvetica Neue",Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header.top{background:#fff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:5px solid transparent;border-image:linear-gradient(90deg,var(--horizon),var(--flame)) 1;box-shadow:0 2px 10px rgba(44,78,86,.08)}
.brandrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brandrow img{height:52px;width:auto;display:block}
.brandrow .sep{width:1px;height:40px;background:var(--line)}
header.top h1{margin:0;font-size:20px;letter-spacing:.3px;color:var(--abyss);font-weight:700}
header.top p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--abyss);background:#fff;color:var(--abyss);padding:7px 14px;border-radius:8px;font-size:14px;font-weight:700}
.btn:hover{background:var(--abyss);color:#fff}
.btn:focus-visible,.card:focus-visible,.stat:focus-visible{outline:3px solid var(--horizon);outline-offset:2px}
.btn.primary{background:var(--flame);border-color:var(--flame);color:var(--pebble)}
.btn.primary:hover{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger:hover{background:var(--warn);color:#fff}
header.top .btn.on{background:var(--flame);border-color:var(--flame);color:var(--pebble)}
.pill{display:inline-block;background:var(--flame);color:var(--pebble);font-weight:700;letter-spacing:1.6px;text-transform:uppercase;font-size:12px;padding:5px 14px;border-radius:8px}
footer.site{margin-top:30px;padding:18px 24px;background:var(--abyss);color:#d9ecf1;font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer.site a{color:var(--horizon);font-weight:700;text-decoration:none}
footer.site b{color:#fff;letter-spacing:1px}
main{padding:16px 20px 40px;max-width:1700px;margin:0 auto}
.stats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.stat{flex:1 0 130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;text-align:left;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--abyss)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat{border-top:4px solid var(--horizon)}.stat.sel{border-top-color:var(--flame);outline:2px solid var(--abyss)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;align-items:center}
.filters input[type=search]{flex:1 1 240px;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:210px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px}
.seg button.on{background:var(--abyss);color:#fff;font-weight:700}
.count{color:var(--muted);font-size:13px;margin:4px 0 10px}
.editbar{background:#fff3e1;border:1px solid var(--flame);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.col{flex:0 0 300px;background:#e6eff2;border-radius:var(--radius);padding:8px;max-height:78vh;display:flex;flex-direction:column}
.col.collapsed{flex-basis:56px;cursor:pointer}
.col.collapsed .cards,.col.collapsed .col-title{display:none}
.col.collapsed .col-head{writing-mode:vertical-rl;padding:8px 0;white-space:nowrap}
.col.over{outline:2px dashed var(--accent)}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px 8px;font-weight:700;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--abyss)}
.col-head .n{background:var(--surface);border-radius:20px;padding:0 8px;font-size:12px;border:1px solid var(--line)}
.col-head button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 4px}
.cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.card{border-left:4px solid var(--horizon)}.card:hover{border-color:var(--flame);border-left-color:var(--flame)}
.card.drag{cursor:grab}
.card h3{margin:0 0 4px;font-size:15px}
.card .wage{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.empty{color:var(--muted);font-size:13px;padding:8px;text-align:center}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--t3bg);color:var(--t3);border:1px solid transparent}
.tag.t1{background:var(--t1bg);color:var(--t1);font-weight:700}
.tag.t2{background:var(--t2bg);color:var(--t2);font-weight:700}
.tag.t3{background:var(--t3bg);color:var(--t3)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.ok{background:var(--t1bg);color:var(--t1)}
.tag.line{background:transparent;border-color:var(--line);color:var(--muted)}
/* list */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{position:sticky;top:0;background:var(--surface);cursor:pointer;white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(127,140,143,.08)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:860px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal-head{border-top:6px solid var(--flame);border-radius:14px 14px 0 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 22px 10px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:22px;color:var(--abyss)}
.modal-body{padding:16px 22px 22px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 14px}
.fact{background:#eef5f7;border-radius:8px;padding:8px 10px}
.fact small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.sec{margin-top:16px}
.sec h4{margin:0 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ember)}
.pre{white-space:pre-wrap;word-break:break-word}
.apply{display:inline-block;background:var(--abyss);color:#fff;padding:9px 18px;border-radius:8px;text-decoration:none;font-weight:700}.apply:hover{background:var(--flame);color:var(--pebble)}
form.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
form.edit label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
form.edit .wide{grid-column:1/-1}
form.edit input,form.edit select,form.edit textarea{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:400;color:var(--ink)}
form.edit textarea{min-height:110px;resize:vertical}
.chk{flex-direction:row!important;align-items:center;gap:8px!important}
.chk input{width:auto}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:40;font-size:14px}
textarea.io{width:100%;min-height:200px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.hint{color:var(--muted);font-size:13px}
@media (max-width:640px){main{padding:12px}.col{flex-basis:84vw}}
.tg{background:#fff3e1;color:#7a4a0c;border:1px solid #f3c98a;font-weight:700}
.tg.more{background:transparent;border-style:dashed}
.loading{padding:50px 0;text-align:center;color:var(--muted)}
.warn-box{background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:8px;margin:10px 0}
</style></head>

<script>
(function(){
"use strict";
var STATUS_ORDER=["HOT JOBS","NEW THIS WEEK","REMOTE PARTNERS","PROPOSED REMOTE PARTNERS","1099 | GIG & SIDE WORK","NOT HIRING","ARCHIVED"];
var COLLAPSED_DEFAULT={"NOT HIRING":true,"ARCHIVED":true};
var data=[],idx=null;
var st={view:"board",q:"",tag:"",tier:"",ind:"",fel:"",drug:"",co:"",status:"",collapsed:Object.assign({},COLLAPSED_DEFAULT),sort:{k:"name",d:1}};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]});}
function $(id){return document.getElementById(id);}
function statuses(){var s=STATUS_ORDER.slice();data.forEach(function(e){if(e.status&&s.indexOf(e.status)<0)s.push(e.status)});return s;}
function tagLabel(t){
  var s=String(t||"").trim();if(!s)return s;
  s=s.charAt(0).toUpperCase()+s.slice(1);
  return s.replace(/\bbyod\b/gi,"BYOD").replace(/\bokc\b/gi,"OKC").replace(/\bwpm\b/gi,"WPM").replace(/\bft\b/gi,"FT").replace(/\bpt\b/gi,"PT").replace(/\bgov\b/gi,"gov");
}
function uniq(f){var m={};data.forEach(function(e){f(e).forEach(function(v){if(v)m[v]=1})});return Object.keys(m).sort(function(a,b){return a.localeCompare(b)});}
function tierClass(t){return t==="TIER 1"?"t1":t==="TIER 2"?"t2":"t3";}
function felClass(f){return /^No/.test(f)?"warn":f?"ok":"line";}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:"";}
function fmtDate(d){if(!d)return"";var p=String(d).split("-");if(p.length<3)return d;var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return m[+p[1]-1]+" "+(+p[2])+", "+p[0];}
function tagsOf(e){return e.tags||[];}

function matches(e,skipStatus){
  if(!skipStatus&&st.status&&e.status!==st.status)return false;
  if(st.tag&&tagsOf(e).indexOf(st.tag)<0)return false;
  if(st.tier&&e.tier!==st.tier)return false;
  if(st.ind&&e.industry.indexOf(st.ind)<0)return false;
  if(st.fel&&e.felony!==st.fel)return false;
  if(st.drug&&e.drug.indexOf(st.drug)<0)return false;
  if(st.co&&e.coworking!==st.co)return false;
  if(st.q){var h=[e.name,tagsOf(e).join(" "),e.industry.join(" "),e.wage,e.skills,e.notes,e.desc,e.other,e.assessment].join(" ").toLowerCase();
    var parts=st.q.toLowerCase().split(/\s+/);for(var i=0;i<parts.length;i++){if(h.indexOf(parts[i])<0)return false;}}
  return true;
}
function cmpUpdated(a,b){return (b.updated||"").localeCompare(a.updated||"")||a.name.localeCompare(b.name);}

function fillSelect(id,label,vals,fmt){
  var el=$(id),cur=el.value;
  el.innerHTML='<option value="">'+esc(label)+'</option>'+vals.map(function(v){return '<option value="'+esc(v)+'">'+esc(fmt?fmt(v):v)+'</option>'}).join("");
  el.value=vals.indexOf(cur)>=0?cur:"";
}
function renderFilters(){
  var counts={};data.forEach(function(e){tagsOf(e).forEach(function(t){counts[t]=(counts[t]||0)+1})});
  var tl=Object.keys(counts).sort(function(a,b){return tagLabel(a).localeCompare(tagLabel(b))});
  fillSelect("fTag","All tags",tl,function(t){return tagLabel(t)+" ("+counts[t]+")"});
  fillSelect("fTier","All tiers",uniq(function(e){return[e.tier]}));
  fillSelect("fInd","All industries",uniq(function(e){return e.industry}));
  fillSelect("fFel","Felony: any",uniq(function(e){return[e.felony]}));
  fillSelect("fDrug","Drug test: any",uniq(function(e){return e.drug}));
  fillSelect("fCo","Co-working: any",uniq(function(e){return[e.coworking]}));
  st.tag=$("fTag").value;st.tier=$("fTier").value;st.ind=$("fInd").value;st.fel=$("fFel").value;st.drug=$("fDrug").value;st.co=$("fCo").value;
}
function renderStats(){
  var all=statuses(),h='<button type="button" class="stat'+(st.status===""?" sel":"")+'" data-s=""><b>'+data.filter(function(e){return matches(e,true)}).length+'</b><span>All</span></button>';
  all.forEach(function(s){
    var n=data.filter(function(e){return e.status===s&&matches(e,true)}).length;
    h+='<button type="button" class="stat'+(st.status===s?" sel":"")+'" data-s="'+esc(s)+'"><b>'+n+'</b><span>'+esc(s)+'</span></button>';
  });
  $("stats").innerHTML=h;
}
function cardHTML(e){
  var m='<span class="tag '+tierClass(e.tier)+'">'+esc(e.tier||"No tier")+'</span>';
  var tg=tagsOf(e);
  tg.slice(0,2).forEach(function(t){m+='<span class="tag tg">'+esc(tagLabel(t))+'</span>';});
  if(tg.length>2)m+='<span class="tag tg more">+'+(tg.length-2)+'</span>';
  if(e.felony)m+='<span class="tag '+felClass(e.felony)+'">'+(/^No/.test(e.felony)?"No felonies":"Felony: "+esc(e.felony.replace(/^Yes\s*/,"").replace(/[()]/g,"")||"yes"))+'</span>';
  if(e.industry[0])m+='<span class="tag line">'+esc(e.industry[0])+'</span>';
  return '<div class="card" data-id="'+esc(e.id)+'" tabindex="0" role="button"><h3>'+esc(e.name)+'</h3>'+
    (e.wage?'<div class="wage" title="'+esc(e.wage)+'">'+esc(e.wage)+'</div>':'')+'<div class="meta">'+m+'</div></div>';
}
function renderBoard(list){
  var h='<div class="board">';
  statuses().forEach(function(s){
    if(st.status&&st.status!==s)return;
    var items=list.filter(function(e){return e.status===s}).sort(cmpUpdated);
    var col=!!st.collapsed[s];
    h+='<section class="col'+(col?" collapsed":"")+'" data-status="'+esc(s)+'"><div class="col-head" data-toggle="'+esc(s)+'"><span>'+esc(s)+' <span class="n">'+items.length+'</span></span><button type="button" data-toggle="'+esc(s)+'" aria-label="Collapse or expand">'+(col?"▸":"▾")+'</button></div>'+
      '<div class="cards">'+(items.length?items.map(cardHTML).join(""):'<div class="empty">Nothing matches</div>')+'</div></section>';
  });
  $("view").innerHTML=h+'</div>';
}
function renderList(list){
  var k=st.sort.k,d=st.sort.d;
  list=list.slice().sort(function(a,b){
    var x=k==="industry"?(a.industry[0]||""):k==="tags"?tagsOf(a).join(","):(a[k]||""),y=k==="industry"?(b.industry[0]||""):k==="tags"?tagsOf(b).join(","):(b[k]||"");
    var r=String(x).localeCompare(String(y),undefined,{numeric:true});
    return (r||a.name.localeCompare(b.name))*d;});
  var cols=[["name","Employer"],["status","Status"],["tier","Tier"],["tags","Tags"],["wage","Wage"],["industry","Industry"],["felony","Felony"],["coworking","Co-working"],["updated","Updated"]];
  var h='<div class="tablewrap"><table><thead><tr>'+cols.map(function(c){return '<th data-sort="'+c[0]+'">'+c[1]+(k===c[0]?(d>0?" ▲":" ▼"):"")+'</th>'}).join("")+'</tr></thead><tbody>';
  list.forEach(function(e){
    h+='<tr class="row" data-id="'+esc(e.id)+'"><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.status)+'</td><td><span class="tag '+tierClass(e.tier)+'">'+esc(e.tier||"—")+'</span></td><td>'+tagsOf(e).map(function(t){return '<span class="tag tg">'+esc(tagLabel(t))+'</span>'}).join(" ")+'</td><td>'+esc(e.wage)+'</td><td>'+esc(e.industry.join(", "))+'</td><td>'+esc(e.felony)+'</td><td>'+esc(e.coworking)+'</td><td>'+esc(fmtDate(e.updated))+'</td></tr>';
  });
  $("view").innerHTML=h+'</tbody></table></div>'+(list.length?"":'<div class="empty">Nothing matches these filters.</div>');
}
function subtitle(){
  var s="Remote opportunities for our sites";
  if(idx&&idx.latestUpdate){try{s+=" · Synced from ClickUp · latest update "+new Date(idx.latestUpdate).toLocaleString("en-US",{timeZone:"America/Chicago",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})+" CT";}catch(e){}}
  $("sub").textContent=s;
}
function render(){
  renderStats();
  var list=data.filter(function(e){return matches(e)});
  $("count").textContent="Showing "+list.length+" of "+data.length+" employers";
  $("vBoard").className=st.view==="board"?"on":"";$("vList").className=st.view==="list"?"on":"";
  subtitle();
  if(st.view==="board")renderBoard(list);else renderList(list);
}

/* ---------- employer detail ---------- */
function closeModal(){$("modalRoot").innerHTML="";}
function openModal(inner){
  $("modalRoot").innerHTML='<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+inner+'</div></div>';
  $("ov").addEventListener("mousedown",function(ev){if(ev.target===$("ov"))closeModal();});
}
function sec(title,txt){return txt?'<div class="sec"><h4>'+esc(title)+'</h4><div class="pre">'+esc(txt)+'</div></div>':"";}
function fact(l,v){return v?'<div class="fact"><small>'+esc(l)+'</small>'+v+'</div>':"";}
function showEmployer(id){
  var e=data.filter(function(x){return x.id===id})[0];if(!e)return;
  var url=safeUrl(e.link);
  var h='<div class="modal-head"><div><h2>'+esc(e.name)+'</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="tag line">'+esc(e.status)+'</span><span class="tag '+tierClass(e.tier)+'">'+esc(e.tier||"No tier")+'</span>'+
    tagsOf(e).map(function(t){return '<span class="tag tg">'+esc(tagLabel(t))+'</span>'}).join("")+
    e.industry.map(function(i){return '<span class="tag line">'+esc(i)+'</span>'}).join("")+'</div></div><div class="actions"><button class="btn" type="button" id="mClose">Close</button></div></div><div class="modal-body">';
  h+='<div class="facts">'+fact("Wage",esc(e.wage))+fact("Education",esc(e.education))+fact("Felony friendly",esc(e.felony))+fact("Drug test",esc(e.drug.join(", ")))+fact("Co-working allowed",esc(e.coworking))+fact("Benefits",e.benefits?"Yes":"Not listed")+fact("Training schedule",esc(e.training))+fact("Last updated",esc(fmtDate(e.updated)))+'</div>';
  if(url)h+='<a class="apply" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open application page ↗</a>';
  else if(e.link)h+='<div class="sec"><h4>Application</h4><div class="pre">'+esc(e.link)+'</div></div>';
  h+=sec("Position description",e.desc)+sec("Required skills",e.skills)+sec("Assessment",e.assessment)+sec("Notes",e.notes)+sec("Other information",e.other);
  openModal(h+'</div>');
  $("mClose").onclick=closeModal;
}

/* ---------- loading ---------- */
function getJSON(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(u+" "+r.status);return r.json();});}
function load(){
  $("view").innerHTML='<div class="loading">Loading employers…</div>';
  return getJSON("data/index.json").then(function(ix){
    idx=ix;var ids=ix.ids||[],out=[],failed=0,next=0,done=0;
    return new Promise(function(resolve){
      function worker(){
        if(next>=ids.length){if(--active===0)resolve();return;}
        var id=ids[next++];
        getJSON("data/e/"+id+".json").then(function(e){out.push(e);},function(){failed++;}).then(function(){
          done++;if(done%40===0)$("view").innerHTML='<div class="loading">Loading employers… '+done+" of "+ids.length+"</div>";worker();});
      }
      var active=Math.min(16,ids.length||1);
      if(!ids.length){resolve();return;}
      for(var i=0;i<active;i++)worker();
    }).then(function(){
      data=out;
      renderFilters();render();
      if(failed)$("count").insertAdjacentHTML("afterend",'<div class="warn-box">'+failed+" employer record(s) could not be loaded. Try Refresh.</div>");
    });
  }).catch(function(){
    $("view").innerHTML='<div class="warn-box">Could not load the employer data. Try Refresh in a moment.</div>';
  });
}

/* ---------- events ---------- */
$("btnRefresh").onclick=function(){var w=document.querySelector(".warn-box");if(w)w.remove();load();};
$("btnClear").onclick=function(){st.q="";st.status="";["fTag","fTier","fInd","fFel","fDrug","fCo"].forEach(function(i){$(i).value=""});$("q").value="";st.tag=st.tier=st.ind=st.fel=st.drug=st.co="";render();};
$("vBoard").onclick=function(){st.view="board";render();};
$("vList").onclick=function(){st.view="list";render();};
$("q").addEventListener("input",function(){st.q=this.value.trim();render();});
[["fTag","tag"],["fTier","tier"],["fInd","ind"],["fFel","fel"],["fDrug","drug"],["fCo","co"]].forEach(function(p){$(p[0]).addEventListener("change",function(){st[p[1]]=this.value;render();});});
$("stats").addEventListener("click",function(ev){var b=ev.target.closest(".stat");if(!b)return;st.status=b.getAttribute("data-s");if(st.status)st.collapsed[st.status]=false;render();});
$("view").addEventListener("click",function(ev){
  var t=ev.target.closest("[data-toggle]");
  if(t){var s=t.getAttribute("data-toggle");st.collapsed[s]=!st.collapsed[s];render();return;}
  var col=ev.target.closest(".col.collapsed");if(col){st.collapsed[col.getAttribute("data-status")]=false;render();return;}
  var th=ev.target.closest("th[data-sort]");
  if(th){var k=th.getAttribute("data-sort");st.sort=st.sort.k===k?{k:k,d:-st.sort.d}:{k:k,d:1};render();return;}
  var c=ev.target.closest("[data-id]");if(c)showEmployer(c.getAttribute("data-id"));
});
$("view").addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList.contains("card")){ev.preventDefault();showEmployer(ev.target.getAttribute("data-id"));}});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeModal();});
load();
})();
</script>
</body>
</html>
